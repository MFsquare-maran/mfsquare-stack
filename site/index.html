<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFsquare · Dienst-Übersicht</title>
<style>
  :root{
    --accent:#33a2cc;
    --accent-strong:#4fb8de;
    --accent-soft:rgba(51,162,204,.14);
    --secondary:#e5e5e5;
    --bg:#0a0d12;
    --bg-2:#0e131a;
    --surface:#141b24;
    --surface-2:#1a222d;
    --border:#232d3a;
    --text:#e5e5e5;
    --muted:#8b96a5;
    --title:#ffffff;
    --radius:14px;
    --hex: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 85% -10%, var(--accent-soft), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  header.top{
    position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom:1px solid var(--border);
  }
  .top-inner{max-width:1240px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .logo{height:38px;width:auto;flex:none;display:block}
  .brand .name{font-size:22px;font-weight:800;letter-spacing:.2px;line-height:1;color:var(--title)}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:3px}

  .search{position:relative;flex:1 1 240px;max-width:340px}
  .search input{
    width:100%;padding:10px 12px 10px 36px;background:var(--surface);
    border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:14px;outline:none;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

  /* Kategorie-Reiter */
  .tabs{max-width:1240px;margin:0 auto;padding:16px 22px 0;display:flex;gap:8px;flex-wrap:wrap}
  .tab{
    padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);color:var(--muted);
    transition:.15s var(--ease);
  }
  .tab:hover{color:var(--text);border-color:var(--accent)}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#04212c}

  main{max-width:1240px;margin:0 auto;padding:22px;padding-bottom:80px}
  .cat{margin-bottom:34px}
  .cat-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
  .hexmark{width:16px;height:16px;background:var(--accent);clip-path:var(--hex);flex:none}
  .cat-head h2{font-size:16px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:0;color:var(--title)}
  .cat-head .count{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:2px 8px;border-radius:999px}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .tile{
    position:relative;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;overflow:hidden;transition:transform .12s var(--ease),border-color .15s,box-shadow .15s;
  }
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .15s}
  .tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 6px 24px rgba(0,0,0,.45)}
  .tile:hover::before{opacity:1}

  .badge{position:relative;width:46px;height:46px;flex:none;display:grid;place-items:center;background:var(--surface-2);clip-path:var(--hex)}
  .badge .initials{font-weight:800;font-size:16px;color:var(--accent);letter-spacing:.5px}
  .badge img{position:absolute;width:26px;height:26px;object-fit:contain}

  .meta{min-width:0}
  .t-name{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--title)}
  .t-host{font-size:12px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .msg{max-width:1240px;margin:40px auto;padding:26px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);text-align:center}
  .msg code{color:var(--text);background:var(--surface);padding:2px 6px;border-radius:6px}
  @media (max-width:560px){ .brand .sub{display:none} .search{order:5;flex-basis:100%;max-width:none} .grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="logo" id="brandLogo" alt="MFsquare Logo">
      <div>
        <div class="name">MFsquare</div>
        <div class="sub">Deine Dienste auf einen Blick</div>
      </div>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="Dienst suchen …" autocomplete="off">
    </div>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<main id="content"></main>

/* =========================================================
   Mini-YAML-Parser für die MFsquare-Struktur
   ========================================================= */
function parseServicesYaml(text){
  const lines = text.replace(/\r/g,'').split('\n');
  const cats = []; let curCat=null, curSvc=null;
  const unq = v => { v=(v||'').trim();
    if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'"))) return v.slice(1,-1);
    return v; };
  for(let raw of lines){
    if(!raw.trim()) continue;
    if(/^\s*#/.test(raw)) continue;
    const indent = raw.length - raw.replace(/^\s+/,'').length;
    let line = raw.trim();
    const isItem = line.startsWith('- ');
    if(isItem) line = line.slice(2).trim();
    const m = line.match(/^([A-Za-zäöüÄÖÜ_]+)\s*:\s*(.*)$/);
    const key = m ? m[1].toLowerCase() : null;
    const val = m ? m[2] : null;
    if(isItem && indent === 0){
      curCat = { name: key==='kategorie' ? unq(val) : unq(line), dienste: [] };
      cats.push(curCat); curSvc=null; continue;
    }
    if(isItem && indent > 0){
      curSvc = {}; if(curCat) curCat.dienste.push(curSvc);
      if(key) curSvc[key] = unq(val); continue;
    }
    if(key){
      if(key==='dienste') continue;
      if(key==='kategorie'){ curCat={name:unq(val),dienste:[]}; cats.push(curCat); curSvc=null; continue; }
      if(curSvc) curSvc[key] = unq(val);
    }
  }
  return cats;
}

/* =========================================================
   Bild / Favicon / Buchstaben-Fallback
   ========================================================= */
function hostOf(url){ try{return new URL(url).hostname;}catch(e){try{return new URL('https://'+url).hostname;}catch(e2){return '';}} }
function originOf(url){ try{return new URL(url).origin;}catch(e){try{return new URL('https://'+url).origin;}catch(e2){return '';}} }
function initials(name){ const p=(name||'?').trim().split(/\s+/); return ((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()||'?'; }
function candidates(svc){
  const host=hostOf(svc.url), origin=originOf(svc.url), list=[];
  if(svc.bild) list.push('bilder/'+svc.bild);
  if(host){
    list.push('https://www.google.com/s2/favicons?domain='+host+'&sz=64');
    list.push('https://icons.duckduckgo.com/ip3/'+host+'.ico');
    if(origin) list.push(origin+'/favicon.ico');
  }
  return list;
}
window.__nextIcon = function(img){
  const list = JSON.parse(img.dataset.cands||'[]');
  let i=(+img.dataset.idx||0)+1;
  if(i<list.length){ img.dataset.idx=i; img.src=list[i]; } else { img.remove(); }
};
function badge(svc){
  const cands=candidates(svc), first=cands[0]||'';
  const img=first ? `<img data-cands='${JSON.stringify(cands).replace(/'/g,"&#39;")}' data-idx="0" src="${first}" alt="" onerror="window.__nextIcon(this)">` : '';
  return `<div class="badge"><span class="initials">${initials(svc.name)}</span>${img}</div>`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function escAttr(s){return esc(s).replace(/'/g,'&#39;');}

/* =========================================================
   Rendern
   ========================================================= */
let DATA = [];      // [{name, dienste:[...]}]
let activeTab = "*"; // "*" = Alle
let filter = "";

function renderTabs(){
  const t=document.getElementById('tabs');
  const tabs = ['<div class="tab '+(activeTab==="*"?"active":"")+'" data-cat="*">Alle</div>'];
  DATA.forEach(c=>{ tabs.push('<div class="tab '+(activeTab===c.name?"active":"")+'" data-cat="'+escAttr(c.name)+'">'+esc(c.name)+'</div>'); });
  t.innerHTML = tabs.join('');
  t.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{ activeTab=el.dataset.cat; renderTabs(); render(); }));
}

function tile(svc){
  return `<div class="tile">
    <a class="link" href="${escAttr(svc.url)}" target="_blank" rel="noopener" style="position:absolute;inset:0;z-index:1"></a>
    ${badge(svc)}
    <div class="meta">
      <div class="t-name">${esc(svc.name)}</div>
      <div class="t-host">${esc(hostOf(svc.url)||svc.url)}</div>
      ${svc.beschreibung?`<div class="t-desc">${esc(svc.beschreibung)}</div>`:''}
    </div>
  </div>`;
}

function render(){
  const c=document.getElementById('content');
  const q=filter.trim().toLowerCase();
  const match = s => !q || ((s.name||'')+' '+(s.url||'')+' '+(s.beschreibung||'')).toLowerCase().includes(q);
  let html='', total=0;
  DATA.forEach(cat=>{
    if(activeTab!=="*" && activeTab!==cat.name) return;
    const items=(cat.dienste||[]).filter(match);
    if(items.length===0) return;
    total+=items.length;
    html+=`<section class="cat">
      <div class="cat-head"><span class="hexmark"></span><h2>${esc(cat.name)}</h2><span class="count">${items.length}</span></div>
      <div class="grid">${items.map(tile).join('')}</div>
    </section>`;
  });
  if(total===0){
    html = q ? `<div class="msg">Nichts gefunden für „${esc(filter)}".</div>`
             : `<div class="msg">Keine Dienste. Trage sie in <code>services.yaml</code> ein.</div>`;
  }
  c.innerHTML = html;
}

document.getElementById('search').addEventListener('input', e=>{ filter=e.target.value; render(); });

/* =========================================================
   Laden der services.yaml
   ========================================================= */
fetch('services.yaml', {cache:'no-store'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
  .then(text=>{ DATA = parseServicesYaml(text); renderTabs(); render(); })
  .catch(err=>{
    document.getElementById('content').innerHTML =
      `<div class="msg"><b>services.yaml konnte nicht geladen werden.</b><br><br>
       Stelle sicher, dass die Datei neben <code>index.html</code> liegt und die Seite
       über einen Webserver (nicht per Doppelklick/<code>file://</code>) geöffnet wird.<br>
       <br>Fehler: ${esc(String(err.message||err))}</div>`;
  });
</script>
